# osm-soa-bake — OpenStreetMap PBF → V3 ABI SoA rows (512 B: key|edges|value).
#
# The substrate behind the cockpit `/osm` endpoint. Deliberately a LIGHT
# dependency closure — `osmpbf` (the PBF reader) + the zero-dep
# `lance-graph-contract` (NodeGuid / EdgeBlock / NodeRow / ValueTenant) — so it
# builds on a disk-constrained host, exactly like q2's `osint-bake`. No ndarray,
# no lance, no datafusion: the ABI row is a byte layout, not an engine.
#
# Sibling layout expected (as in q2/geo): ../lance-graph and ../OGAR next to
# this repo. `ogar-osm` is a 2-node tree (itself + the dep-free `ogar-vocab`),
# so the light closure holds.
[package]
name = "osm-soa-bake"
version = "0.1.0"
edition = "2021"
publish = false
description = "OSM PBF → V3 SoA NodeRows, keyed by the Cesium-TMS HHTL cascade."
license = "Apache-2.0"

[workspace]

[dependencies]
osmpbf = "0.3"
# lance-graph is wired by PATH — the workspace convention (siblings side by
# side, transparently symlinked). Do NOT change this to a git source: PR #8 did
# exactly that, unasked, guessing `branch = "main"` for a family whose rule is
# that it moves in exact lockstep. An unpinned branch is a drift vector into a
# version-locked family, and lance-graph's own P0 says to STOP and ask when a
# fork's coordinates are unknown rather than guess them.
lance-graph-contract = { path = "../lance-graph/crates/lance-graph-contract", features = ["guid-v3-tail"] }
# The upstream geo surface: the minted concepts + the capability table this
# crate registers against (`src/capability.rs`).
ogar-osm = { git = "https://github.com/AdaWorldAPI/OGAR.git", branch = "main" }
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR.git", branch = "main" }

[[bin]]
name = "bake"
path = "src/bin/bake.rs"

[profile.release]
opt-level = 3

[[bin]]
name = "tier_probe"
path = "src/bin/tier_probe.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "slab_stats"
path = "src/bin/slab_stats.rs"

[[bin]]
name = "building_probe"
path = "src/bin/building_probe.rs"

[[bin]]
name = "wayclass_probe"
path = "src/bin/wayclass_probe.rs"
